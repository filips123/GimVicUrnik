name: Check Backend

on:
  push:
    paths:
      - .github/workflows/api.yaml
      - API/**
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/api.yaml
      - API/**

defaults:
  run:
    working-directory: API
    shell: bash

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Poetry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
            ~/.local/share/pypoetry
            ~/.local/bin/poetry
            ./.ruff_cache
          key: ${{ runner.os }}-poetry-lint-${{ hashFiles('**/poetry.lock') }}
          restore-keys: ${{ runner.os }}-poetry-lint-

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          ~/.local/bin/poetry config virtualenvs.create false
          echo "~/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --extras sentry

      - name: Lint the project with ruff check
        if: always()
        run: ruff check --output-format=github

      - name: Lint the project with ruff format
        if: always()
        run: ruff format --check

  typecheck:
    name: Typechecking
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Poetry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
            ~/.local/share/pypoetry
            ~/.local/bin/poetry
            ./.mypy_cache
          key: ${{ runner.os }}-poetry-typecheck-${{ hashFiles('**/poetry.lock') }}
          restore-keys: ${{ runner.os }}-poetry-typecheck-

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          ~/.local/bin/poetry config virtualenvs.create false
          echo "~/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --extras sentry

      - name: Typecheck the project
        run: mypy gimvicurnik
