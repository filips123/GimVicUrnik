name: Check Frontend

on:
  push:
    paths:
      - .github/workflows/website.yaml
      - website/**
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/website.yaml
      - website/**

defaults:
  run:
    working-directory: website
    shell: bash

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Configure Yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/yarn
            ~/.yarn/berry/cache
            ./node_modules/.cache
            ./node_modules/.vite
          key: ${{ runner.os }}-yarn-lint-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-lint-

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Copy configuration
        run: cp .env.sample .env

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint the project with ESLint
        if: always()
        run: yarn lint

      - name: Lint the project with Prettier
        if: always()
        run: yarn format

  typecheck:
    name: Typechecking
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Configure Yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/yarn
            ~/.yarn/berry/cache
            ./node_modules/.cache
            ./node_modules/.vite
          key: ${{ runner.os }}-yarn-typecheck-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-typecheck-

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Copy configuration
        run: cp .env.sample .env

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck the project
        run: yarn typecheck

  build:
    name: Building
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Configure Yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/yarn
            ~/.yarn/berry/cache
            ./node_modules/.cache
            ./node_modules/.vite
          key: ${{ runner.os }}-yarn-build-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-build-

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Copy configuration
        run: cp .env.sample .env

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build the project
        run: yarn build
